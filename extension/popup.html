<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Zalando Cart Monitor</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 260px;
      padding: 12px;
      font-size: 13px;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: 600;
    }
    input[type="text"] {
      width: 100%;
      padding: 6px;
      margin-top: 4px;
      box-sizing: border-box;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 8px;
      cursor: pointer;
    }
    #status {
      margin-top: 8px;
      color: #2a7a2a;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <h3 style="margin:0;">Zalando Cart Monitor</h3>

  <div class="row">
    <input type="checkbox" id="autoAddEnabled" />
    <label for="autoAddEnabled" style="margin:0;">Automatyczne dodawanie do koszyka</label>
  </div>

  <label for="discountCode">Kod rabatowy (wpisywany do koszyka)</label>
  <input type="text" id="discountCode" placeholder="np. WIOSNA10" />

  <label for="apiBase">Adres backendu</label>
  <input type="text" id="apiBase" placeholder="http://51.255.34.32:5050" />

  <button id="saveBtn">Zapisz</button>
  <button id="pollNowBtn">Sprawdź teraz</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
