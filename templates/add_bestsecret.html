{% extends "layout.html" %}

{% block content %}
<h2>Dodaj produkt z BestSecret</h2>

<form method="POST">
    <label>URL produktu BestSecret:</label><br>
    <input type="text" name="product_url" placeholder="https://www.bestsecret.com/product.htm?code=...&colorCode=..." autocomplete="off" required>
    <br><br>

    <label>Rozmiary EU do monitorowania (np. 38, 39, 40):</label><br>
    <input type="text" name="sizes" placeholder="np. 37, 38, 39" required>
    <br><br>

    <button type="submit"> Dodaj produkt</button>
</form>

<br>
<a href="/bestsecret">⬅ Powrót</a>
{% endblock %}
